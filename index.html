<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f4f1e8">
<title>Kupalsa Planner</title>
<style>
:root{--paper:#f4f1e8;--ink:#111;--mark:#c63d32;--rule:rgba(17,17,17,.25);--shadow:0 7px 20px rgba(17,17,17,.13)}
*{box-sizing:border-box}html,body{margin:0;min-width:320px;background:var(--paper);color:var(--ink);font:15px/1.35 ui-monospace,SFMono-Regular,Consolas,monospace}button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer}.app{min-height:100vh;background:var(--paper)}
.header{position:sticky;top:0;z-index:20;height:56px;display:flex;align-items:center;gap:10px;padding:0 14px;border-bottom:1px solid var(--ink);background:var(--paper)}.header-title{flex:1;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.icon-btn{width:38px;height:38px;border:0;background:transparent;font-size:22px}.nav{position:fixed;inset:56px auto 0 0;z-index:18;width:260px;padding:20px 14px;background:var(--paper);border-right:1px solid var(--ink);transform:translateX(-101%);transition:.18s}.nav.open{transform:none}.nav button{display:block;width:100%;padding:12px 8px;text-align:left;border:0;border-bottom:1px solid var(--rule);background:transparent}.nav button.active{font-weight:800}.content{max-width:760px;margin:0 auto;padding:22px 18px 90px}.view[hidden]{display:none!important}
.hero{padding:24px 0 18px;border-bottom:2px solid var(--ink)}.hero-kicker{font-size:11px;text-transform:uppercase;letter-spacing:.12em}.hero h1{margin:7px 0;font-size:clamp(25px,5vw,42px);line-height:1.06}.hero small{opacity:.58}.section-title{margin:22px 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.1em}
.rows{border-top:1px solid var(--ink)}.row{position:relative;padding:14px 4px;border-bottom:1px solid var(--ink);background:var(--paper)}.row-head{display:flex;align-items:flex-start;gap:10px}.row-main{min-width:0;flex:1}.row-title{font-weight:700;font-size:16px;word-break:break-word}.row-desc{margin-top:4px;opacity:.6}.row-meta{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-top:9px;font-size:12px}.row.completed .row-title{text-decoration:line-through;color:var(--mark)}
.plan-btn{min-height:36px;padding:6px 10px;border:1px solid var(--ink);background:var(--ink);color:var(--paper);white-space:nowrap}.more{position:relative}.more summary{list-style:none;padding:5px 9px;font-size:21px}.more summary::-webkit-details-marker{display:none}.more-menu{position:absolute;right:0;z-index:8;min-width:190px;padding:6px;border:1px solid var(--ink);background:var(--paper);box-shadow:var(--shadow)}.more-menu button{display:block;width:100%;padding:9px;text-align:left;border:0;border-bottom:1px solid var(--rule);background:transparent}.inline-plan{margin:12px 0 2px;padding:12px 14px;border-left:4px solid var(--ink);background:rgba(17,17,17,.055);box-shadow:var(--shadow)}.inline-plan h3{margin:0 0 8px}.inline-plan li{margin:5px 0}.text-link{padding:0;border:0;border-bottom:1px solid;background:transparent;font-weight:700}
.fab{position:fixed;right:22px;bottom:22px;z-index:15;width:52px;height:52px;border:0;border-radius:50%;background:var(--ink);color:var(--paper);font-size:30px;box-shadow:var(--shadow)}
.library-group{margin-bottom:26px}.library-row{display:flex;align-items:center;gap:8px;width:100%;padding:13px 4px;border:0;border-bottom:1px solid var(--ink);background:transparent;text-align:left}.library-row span:first-child{flex:1}.badge{font-size:10px;opacity:.55}
.calendar-toolbar{display:flex;align-items:center;gap:7px;padding:10px 0;border-bottom:1px solid var(--ink);flex-wrap:wrap}.segmented{display:flex;border:1px solid var(--ink)}.segmented button{padding:7px 10px;border:0;border-right:1px solid var(--ink);background:transparent}.segmented button:last-child{border:0}.segmented button.active{background:var(--ink);color:var(--paper)}.date-label{flex:1;min-width:140px;font-weight:700}.calendar-entry{padding:13px 4px;border-bottom:1px solid var(--ink)}.calendar-time{font-weight:800}.calendar-path{margin-top:4px;font-size:11px;opacity:.55}.week-grid{display:grid;grid-template-columns:repeat(7,minmax(150px,1fr));gap:1px;overflow-x:auto;background:var(--ink);border:1px solid var(--ink)}.week-day{min-height:220px;padding:9px;background:var(--paper)}.week-day h3{margin:0 0 8px;font-size:12px}.occurrence-done{text-decoration:line-through;color:var(--mark)}
.empty{padding:26px 5px;opacity:.55}.overlay{position:fixed;inset:0;z-index:40;display:grid;place-items:center;padding:16px;background:rgba(17,17,17,.46)}.overlay[hidden]{display:none}.modal{width:min(540px,100%);max-height:88vh;overflow:auto;padding:18px;border:1px solid var(--ink);background:var(--paper);box-shadow:var(--shadow)}.modal h2{margin-top:0}.field{display:grid;gap:5px;margin:12px 0}.field input,.field textarea,.field select{width:100%;padding:10px;border:1px solid var(--ink);background:var(--paper)}.days{display:flex;gap:5px;flex-wrap:wrap}.days label{padding:7px;border:1px solid var(--ink)}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.btn{padding:9px 13px;border:1px solid var(--ink);background:transparent}.btn.primary{background:var(--ink);color:var(--paper)}.mark{color:var(--mark)}
@media(min-width:900px){.app{display:grid;grid-template-columns:260px 1fr;grid-template-rows:56px 1fr}.header{grid-column:2;grid-row:1}.nav{position:sticky;top:0;grid-column:1;grid-row:1/3;height:100vh;transform:none;border-top:1px solid var(--ink)}.content{grid-column:2;grid-row:2;align-self:start;width:100%;max-width:920px}.menu-toggle{display:none}.fab{right:calc((100vw - 260px - min(920px,100vw - 260px))/2 + 30px)}}
@media(max-width:640px){.content{padding:14px 12px 82px}.hero{padding-top:16px}.row{padding:12px 2px}.row-head{align-items:center}.row-meta{display:grid;grid-template-columns:1fr auto}.plan-btn{min-height:40px}.week-grid{grid-template-columns:repeat(7,210px)}.fab{right:16px;bottom:16px}.header{height:52px}.nav{inset-top:52px}}
</style>
</head>
<body>
<div class="app">
<header class="header"><button class="icon-btn menu-toggle" id="menuToggle">☰</button><button class="icon-btn" id="backBtn" hidden>‹</button><div class="header-title" id="headerTitle">Kupalsa</div><button class="icon-btn" id="moreHeader">⋯</button></header>
<nav class="nav" id="nav"><button data-route="library" class="active">Life goals</button><button data-route="calendar">Action calendar</button><button data-route="current">Current page</button><button id="connectionBtn">Data connection</button></nav>
<main class="content">
<section class="view" id="libraryView"><div class="hero"><div class="hero-kicker">Kupalsa Planner</div><h1>Life goals</h1><small>Direction → stages → plans → actions</small></div><div id="libraryContent"></div></section>
<section class="view" id="plannerView" hidden><div id="plannerContent"></div></section>
<section class="view" id="calendarView" hidden><div class="hero"><div class="hero-kicker">Execution</div><h1>Action calendar</h1><small>Scheduled actions from every plan</small></div><div class="calendar-toolbar"><button class="icon-btn" id="prevDate">‹</button><div class="date-label" id="dateLabel"></div><button class="icon-btn" id="nextDate">›</button><button class="btn" id="todayBtn">Today</button><div class="segmented"><button data-view="today">Today</button><button data-view="day">Day</button><button data-view="week">Week</button></div></div><div id="calendarContent"></div></section>
</main><button class="fab" id="fab">+</button></div>
<div class="overlay" id="connectionModal" hidden><form class="modal" id="connectionForm"><h2>Private data</h2><label class="field">GitHub user<input id="ghUser" required></label><label class="field">Repository<input id="ghRepo" required></label><label class="field">Plan ID<input id="ghPlan"></label><label class="field">Fine-grained token<input id="ghToken" type="password" required></label><div class="modal-actions"><button type="button" class="btn close-modal">Cancel</button><button class="btn primary">Connect</button></div><p id="connectionStatus"></p></form></div>
<div class="overlay" id="scheduleModal" hidden><form class="modal" id="scheduleForm"><h2>Action schedule</h2><input type="hidden" id="scheduleStepId"><label class="field">Action type<select id="stepType"><option value="one-time">One-time</option><option value="routine">Routine</option></select></label><div class="field"><span>Routine days</span><div class="days" id="dayChecks"></div></div><label class="field">Start time<input type="time" id="startTime"></label><label class="field">End time<input type="time" id="endTime"></label><label class="field">Context<textarea id="scheduleContext" placeholder="On the way to work"></textarea></label><div class="modal-actions"><button type="button" class="btn close-modal">Cancel</button><button class="btn primary">Save schedule</button></div></form></div>
<script>
const STORAGE='kupalsa-planner-connection-v1',LOCAL='kupalsa-planner-v1',OCC='kupalsa-occurrences-v1';
const DAYS=['sun','mon','tue','wed','thu','fri','sat'],DAY_LABEL={sun:'Sun',mon:'Mon',tue:'Tue',wed:'Wed',thu:'Thu',fri:'Fri',sat:'Sat'};
let connection=JSON.parse(localStorage.getItem(STORAGE)||'null'),indexData=null,current=null,currentSha=null,currentRoute='library',expanded=new Set(),calendarDate=new Date(),calendarMode='today',allPlans=[];
const $=s=>document.querySelector(s),esc=s=>String(s??'');
function normalizeStep(s){return {...s,description:s.description||'',due:s.due||'',completed:Boolean(s.completed),subPlanId:s.subPlanId||null,stepType:s.stepType||'one-time',schedule:Array.isArray(s.schedule)?s.schedule:[]}}
function normalizePlan(p){return {...p,type:p.type||'plan',steps:(p.steps||[]).map(normalizeStep)}}
function planPath(id){return `data/plans/${id}.json`}
function b64(t){return btoa(unescape(encodeURIComponent(t)))}function unb64(t){return decodeURIComponent(escape(atob(t.replace(/\n/g,''))))}
async function request(path='',options={}){if(!connection?.token)throw Error('Connect private data first');const r=await fetch(`https://api.github.com/repos/${encodeURIComponent(connection.user)}/${encodeURIComponent(connection.repo)}/contents/${path}`,{...options,headers:{Accept:'application/vnd.github+json',Authorization:`Bearer ${connection.token}`,'X-GitHub-Api-Version':'2022-11-28',...(options.headers||{})}});if(!r.ok)throw Error(`${r.status}: ${await r.text()}`);return r.status===204?null:r.json()}
async function loadIndex(){const f=await request('data/plans.json');indexData=JSON.parse(unb64(f.content));indexData.plans=indexData.plans||[];indexData.sha=f.sha;return indexData}
async function saveIndex(){const {sha,...body}=indexData;const r=await request('data/plans.json',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:'Update planner index',content:b64(JSON.stringify(body,null,2)),sha})});indexData.sha=r.content.sha}
async function fetchPlan(id){const f=await request(planPath(id));return {plan:normalizePlan(JSON.parse(unb64(f.content))),sha:f.sha}}
async function savePlan(plan=current,sha=currentSha){if(!plan?.id)throw Error('No plan loaded');const snapshot=structuredClone(plan);snapshot.updatedAt=new Date().toISOString();const r=await request(planPath(snapshot.id),{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:`Update ${snapshot.id}`,content:b64(JSON.stringify(snapshot,null,2)),sha})});if(current?.id===snapshot.id){current=normalizePlan(snapshot);currentSha=r.content.sha;localStorage.setItem(LOCAL,JSON.stringify(current))}return r.content.sha}
async function openPlan(id){const x=await fetchPlan(id);current=x.plan;currentSha=x.sha;connection.planId=id;localStorage.setItem(STORAGE,JSON.stringify(connection));localStorage.setItem(LOCAL,JSON.stringify(current));showRoute('current');renderPlanner()}
async function createPlan({title,type='plan',parentId=null,parentStepId=null,parentGoalId=null,parentGoalPlanId=null}){const id=(title.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'')||`plan-${Date.now()}`)+'-'+Date.now().toString(36);const p={id,type,parentId,parentStepId,parentGoalId,parentGoalPlanId,goal:title,createdAt:new Date().toISOString(),steps:[]};const r=await request(planPath(id),{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:`Create ${id}`,content:b64(JSON.stringify(p,null,2))})});indexData.plans.push({id,title,type,parentId,parentStepId,parentGoalId,parentGoalPlanId,path:planPath(id),createdAt:p.createdAt,updatedAt:p.createdAt});try{await saveIndex()}catch(e){await request(planPath(id),{method:'DELETE',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:`Rollback ${id}`,sha:r.content.sha})});throw e}return p}
async function createChildPlan(step){if(step.subPlanId)return toggleInlinePlan(step);const title=prompt('Plan title',step.title);if(!title)return;const parent=structuredClone(current),parentSha=currentSha;const child=await createPlan({title,type:'sub-plan',parentId:parent.id,parentStepId:step.id,parentGoalId:parent.parentGoalId||parent.id,parentGoalPlanId:parent.type==='life-goal'?parent.id:(parent.parentGoalPlanId||parent.parentId)});const target=parent.steps.find(s=>s.id===step.id);target.subPlanId=child.id;try{await savePlan(parent,parentSha);current=parent;currentSha=(await fetchPlan(parent.id)).sha;renderPlanner()}catch(e){alert('Plan created but parent link failed. Retry from library.');throw e}}
async function toggleInlinePlan(step){if(expanded.has(step.id)){expanded.delete(step.id);renderPlanner();return}expanded.add(step.id);renderPlanner();const host=document.querySelector(`[data-step="${step.id}"] .inline-host`);try{const {plan}=await fetchPlan(step.subPlanId);host.replaceChildren(inlinePlanNode(plan))}catch(e){host.textContent='Could not load plan.'}}
function inlinePlanNode(p){const d=document.createElement('div');d.className='inline-plan';const h=document.createElement('h3');h.textContent=p.goal;d.append(h);const ul=document.createElement('ul');(p.steps||[]).slice(0,6).forEach(s=>{const li=document.createElement('li');li.textContent=s.title;ul.append(li)});if(!p.steps.length){const li=document.createElement('li');li.textContent='No actions yet';ul.append(li)}d.append(ul);const b=document.createElement('button');b.className='text-link';b.textContent='Open full plan';b.onclick=()=>openPlan(p.id);d.append(b);return d}
function returnToParent(){const id=current?.parentGoalPlanId||current?.parentId;if(id)openPlan(id);else showRoute('library')}
function rowNode(step){const r=document.createElement('article');r.className='row'+(step.completed?' completed':'');r.dataset.step=step.id;const head=document.createElement('div');head.className='row-head';const main=document.createElement('div');main.className='row-main';const t=document.createElement('div');t.className='row-title';t.textContent=step.title;main.append(t);if(step.description){const d=document.createElement('div');d.className='row-desc';d.textContent=step.description;main.append(d)}const meta=document.createElement('div');meta.className='row-meta';const due=document.createElement('span');due.textContent=step.due?`Due ${step.due}`:(step.stepType==='routine'?'Routine':'');meta.append(due);const plan=document.createElement('button');plan.className='plan-btn';plan.textContent=step.subPlanId?'Plan':'Create plan';plan.onclick=()=>step.subPlanId?toggleInlinePlan(step):createChildPlan(step);meta.append(plan);main.append(meta);head.append(main);const more=document.createElement('details');more.className='more';more.innerHTML='<summary>⋯</summary>';const menu=document.createElement('div');menu.className='more-menu';[['Complete',()=>{step.completed=!step.completed;savePlan().then(renderPlanner)}],['Schedule',()=>openSchedule(step)],['Edit',()=>editStep(step)],['Delete',()=>deleteStep(step)]].forEach(([x,fn])=>{const b=document.createElement('button');b.textContent=x;b.onclick=fn;menu.append(b)});more.append(menu);head.append(more);r.append(head);const host=document.createElement('div');host.className='inline-host';r.append(host);return r}
function renderPlanner(){if(!current)return;$('#headerTitle').textContent=current.goal;$('#backBtn').hidden=false;const c=$('#plannerContent');c.replaceChildren();const hero=document.createElement('div');hero.className='hero';hero.innerHTML=`<div class="hero-kicker">${current.type==='life-goal'?'Life goal':current.type==='sub-plan'?'Sub-plan':'Plan'}</div><h1></h1><small></small>`;hero.querySelector('h1').textContent=current.goal;hero.querySelector('small').textContent=current.createdAt?`Created ${new Date(current.createdAt).toLocaleDateString()}`:'';c.append(hero);const s=document.createElement('div');s.className='section-title';s.textContent=current.type==='life-goal'?'Stages':'Steps & actions';c.append(s);const rows=document.createElement('div');rows.className='rows';current.steps.forEach(x=>rows.append(rowNode(x)));if(!current.steps.length)rows.innerHTML='<div class="empty">No actions yet.</div>';c.append(rows)}
async function renderLibrary(){const c=$('#libraryContent');c.innerHTML='<div class="empty">Loading…</div>';if(!connection?.token){c.innerHTML='<div class="empty">Connect your private data repository.</div>';return}try{await loadIndex();c.replaceChildren();for(const [name,filter] of [['Life goals',p=>p.type==='life-goal'],['Standalone plans',p=>p.type!=='life-goal'&&!p.parentId]]){const g=document.createElement('div');g.className='library-group';g.innerHTML=`<div class="section-title">${name}</div>`;indexData.plans.filter(filter).forEach(p=>{const b=document.createElement('button');b.className='library-row';const title=document.createElement('span');title.textContent=p.title;const badge=document.createElement('span');badge.className='badge';badge.textContent=p.type||'plan';b.append(title,badge);b.onclick=()=>openPlan(p.id);g.append(b)});c.append(g)}}catch(e){c.innerHTML=`<div class="empty mark">${esc(e.message)}</div>`}}
function editStep(step){const title=prompt('Action title',step.title);if(title===null)return;const desc=prompt('Description',step.description||'');step.title=title.trim()||step.title;step.description=desc??step.description;savePlan().then(renderPlanner)}function deleteStep(step){if(step.subPlanId){alert('This action has a linked plan. Open or detach that plan before deleting the action.');return}if(!confirm(`Delete “${step.title}”?`))return;current.steps=current.steps.filter(s=>s.id!==step.id);savePlan().then(renderPlanner)}
function openSchedule(step){$('#scheduleStepId').value=step.id;$('#stepType').value=step.stepType||'one-time';const slot=step.schedule?.[0]||{};document.querySelectorAll('#dayChecks input').forEach(i=>i.checked=(slot.days||[]).includes(i.value));$('#startTime').value=slot.startTime||'';$('#endTime').value=slot.endTime||'';$('#scheduleContext').value=slot.context||'';$('#scheduleModal').hidden=false}
function saveRoutineSchedule(step,form){step.stepType=form.stepType;step.schedule=form.stepType==='routine'?[{days:form.days,startTime:form.startTime,endTime:form.endTime,context:form.context,timezone:Intl.DateTimeFormat().resolvedOptions().timeZone,active:true}]:[];return savePlan()}
function dateKey(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}function occurrenceStore(){return JSON.parse(localStorage.getItem(OCC)||'{}')}function occurrenceDone(stepId,date){return Boolean(occurrenceStore()[`${stepId}@${date}`])}function toggleOccurrence(stepId,date){const o=occurrenceStore(),k=`${stepId}@${date}`;o[k]=!o[k];localStorage.setItem(OCC,JSON.stringify(o));renderCalendar()}
function calendarOccurrences(date,plans=allPlans){const key=dateKey(date),day=DAYS[date.getDay()],out=[];plans.forEach(p=>(p.steps||[]).filter(s=>!s.completed).forEach(s=>{normalizeStep(s);if(s.stepType==='routine')s.schedule.filter(x=>x.active!==false&&(x.days||[]).includes(day)).forEach(x=>out.push({step:s,plan:p,date:key,time:x.startTime||'',end:x.endTime||'',context:x.context||''}));else if(s.due===key)out.push({step:s,plan:p,date:key,time:'',end:'',context:'One-time'})}));return out.sort((a,b)=>a.time.localeCompare(b.time))}
async function loadAllPlans(){if(!indexData)await loadIndex();const results=await Promise.allSettled(indexData.plans.map(p=>fetchPlan(p.id)));allPlans=results.filter(x=>x.status==='fulfilled').map(x=>x.value.plan)}
function occurrenceNode(o){const d=document.createElement('div');d.className='calendar-entry'+(occurrenceDone(o.step.id,o.date)?' occurrence-done':'');const time=document.createElement('div');time.className='calendar-time';time.textContent=o.time?`${o.time}${o.end?'–'+o.end:''}`:(o.context||'Any time');const t=document.createElement('div');t.textContent=o.step.title;const path=document.createElement('div');path.className='calendar-path';path.textContent=`${o.plan.goal} → ${o.step.title}`;d.append(time,t,path);d.onclick=()=>toggleOccurrence(o.step.id,o.date);return d}
async function renderCalendar(){const c=$('#calendarContent');c.innerHTML='<div class="empty">Loading…</div>';try{await loadAllPlans();$('#dateLabel').textContent=calendarDate.toLocaleDateString(undefined,{weekday:'long',month:'short',day:'numeric'});document.querySelectorAll('.segmented button').forEach(b=>b.classList.toggle('active',b.dataset.view===calendarMode));c.replaceChildren();if(calendarMode==='week'){const grid=document.createElement('div');grid.className='week-grid';const start=new Date(calendarDate);start.setDate(start.getDate()-start.getDay());for(let i=0;i<7;i++){const d=new Date(start);d.setDate(start.getDate()+i);const col=document.createElement('div');col.className='week-day';const h=document.createElement('h3');h.textContent=d.toLocaleDateString(undefined,{weekday:'short',day:'numeric'});col.append(h);calendarOccurrences(d).forEach(o=>col.append(occurrenceNode(o)));grid.append(col)}c.append(grid)}else{const items=calendarOccurrences(calendarDate);items.forEach(o=>c.append(occurrenceNode(o)));if(!items.length)c.innerHTML='<div class="empty">No scheduled actions.</div>'}}catch(e){c.innerHTML=`<div class="empty mark">${esc(e.message)}</div>`}}
function showRoute(route){currentRoute=route;document.querySelectorAll('.view').forEach(v=>v.hidden=v.id!==`${route==='current'?'planner':route}View`);document.querySelectorAll('.nav [data-route]').forEach(b=>b.classList.toggle('active',b.dataset.route===route));$('#nav').classList.remove('open');$('#fab').hidden=route==='calendar';$('#backBtn').hidden=route!=='current';if(route==='library')renderLibrary();if(route==='calendar')renderCalendar();if(route==='current')renderPlanner()}
function modalClose(){document.querySelectorAll('.overlay').forEach(x=>x.hidden=true)}
DAYS.forEach(d=>{const l=document.createElement('label'),i=document.createElement('input');i.type='checkbox';i.value=d;l.append(i,DAY_LABEL[d]);$('#dayChecks').append(l)});
$('#menuToggle').onclick=()=>$('#nav').classList.toggle('open');document.querySelectorAll('.nav [data-route]').forEach(b=>b.onclick=()=>showRoute(b.dataset.route));$('#connectionBtn').onclick=()=>{$('#ghUser').value=connection?.user||'kupalsa';$('#ghRepo').value=connection?.repo||'Kupalsa-Planner-Data';$('#ghPlan').value=connection?.planId||'';$('#ghToken').value=connection?.token||'';$('#connectionModal').hidden=false};document.querySelectorAll('.close-modal').forEach(b=>b.onclick=modalClose);$('#backBtn').onclick=returnToParent;
$('#connectionForm').onsubmit=async e=>{e.preventDefault();connection={user:$('#ghUser').value.trim(),repo:$('#ghRepo').value.trim(),planId:$('#ghPlan').value.trim(),token:$('#ghToken').value.trim()};localStorage.setItem(STORAGE,JSON.stringify(connection));try{await loadIndex();modalClose();showRoute('library')}catch(err){$('#connectionStatus').textContent=err.message}};
$('#scheduleForm').onsubmit=async e=>{e.preventDefault();const step=current.steps.find(s=>s.id===$('#scheduleStepId').value);await saveRoutineSchedule(step,{stepType:$('#stepType').value,days:[...document.querySelectorAll('#dayChecks input:checked')].map(i=>i.value),startTime:$('#startTime').value,endTime:$('#endTime').value,context:$('#scheduleContext').value.trim()});modalClose();renderPlanner()};
$('#prevDate').onclick=()=>{calendarDate.setDate(calendarDate.getDate()-(calendarMode==='week'?7:1));renderCalendar()};$('#nextDate').onclick=()=>{calendarDate.setDate(calendarDate.getDate()+(calendarMode==='week'?7:1));renderCalendar()};$('#todayBtn').onclick=()=>{calendarDate=new Date();renderCalendar()};document.querySelectorAll('.segmented button').forEach(b=>b.onclick=()=>{calendarMode=b.dataset.view;renderCalendar()});
$('#fab').onclick=async()=>{if(currentRoute==='current'&&current){current.steps.push(normalizeStep({id:crypto.randomUUID(),title:'New action'}));await savePlan();renderPlanner()}else if(currentRoute==='library'){if(!indexData)await loadIndex();const title=prompt('Page title');if(!title)return;const life=confirm('Create as a Life Goal?');const p=await createPlan({title,type:life?'life-goal':'plan'});await openPlan(p.id)}};
$('#moreHeader').onclick=()=>$('#nav').classList.toggle('open');
(async()=>{if(connection?.token){try{await loadIndex();if(connection.planId){const x=await fetchPlan(connection.planId);current=x.plan;currentSha=x.sha}}catch{}}showRoute('library')})();
</script>
</body></html>
